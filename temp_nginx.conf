server {
    server_name schoolclassprogress.my.id www.schoolclassprogress.my.id;
    client_max_body_size 25M;

    # --- FRONTEND (React scp_web) ---
    root /var/www/SCP-Project/frontend/scp_web/dist; # Ganti ke /build jika pakai CRA
    index index.html;

    
    # --- OTA Updates (Capgo Mobile) ---
    # --- OTA Updates (Capgo Mobile) ---
    location ^~ /ota {
        alias /var/www/SCP-Project/ota;
        try_files $uri $uri/ =404;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- BACKEND (Laravel scp API) ---
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/SCP-Project/scp/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/SCP-Project/scp/public;
    }

    # Handle penyimpanan file/gambar publik Laravel (jika pakai storage:link)
    location ^~ /storage {
        alias /var/www/SCP-Project/scp/storage/app/public;
        try_files $uri $uri/ =404;
    }

    location @laravel {
        rewrite /api/(.*)$ /api/index.php?/$1 last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/schoolclassprogress.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/schoolclassprogress.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.schoolclassprogress.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = schoolclassprogress.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name schoolclassprogress.my.id www.schoolclassprogress.my.id;
    client_max_body_size 25M;
    return 404; # managed by Certbot




}