worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       "C:/laragon/bin/nginx/nginx-1.22.0/conf/mime.types";
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Support uploads up to 25MB (matching post_max_size in php.ini)
    client_max_body_size 25M;

    upstream scp_backend_pool {
        least_conn;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        server 127.0.0.1:9004;
        server 127.0.0.1:9005;
        server 127.0.0.1:9006;
    }

    server {
        listen       8000;
        server_name  localhost 127.0.0.1;
        root         "D:/MyUKK/SchoolClassProject/scp/public";
        index        index.php index.html;

        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   scp_backend_pool;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        "C:/laragon/bin/nginx/nginx-1.22.0/conf/fastcgi_params";
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }
}
